// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        // Sürüm bilgilerini güncelledim ve daha tutarlı hale getirdim
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        kotlinVersion = "1.9.25"
        ndkVersion = "26.1.10909125"
        
        // Yeni eklenen ortak bağımlılık sürümleri
        androidxCoreVersion = "1.12.0"
        androidxAppCompatVersion = "1.6.1"
        googlePlayServicesVersion = "20.6.0"
    }
    
    repositories {
        google()
        mavenCentral()
        // JCenter artık kullanılmıyor, eklenmesine gerek yok
    }
    
    dependencies {
        // Daha spesifik sürüm belirttim
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath "com.facebook.react:react-native-gradle-plugin:0.74.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        
        // Firebase için gerekli olabilir
        classpath 'com.google.gms:google-services:4.4.1'
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            url("${rootDir}/../node_modules/react-native/android")
        }
        maven {
            url("${rootDir}/../node_modules/jsc-android/dist")
        }
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        
        // Expo modülleri için
        maven {
            url("${rootDir}/../node_modules/expo-camera/android/maven")
        }
    }
    
    // AndroidX ve Jetifier ayarları
    configurations.all {
        resolutionStrategy {
            force "androidx.core:core:$androidxCoreVersion"
            force "androidx.appcompat:appcompat:$androidxAppCompatVersion"
            // Çakışan kütüphaneleri engelle
            exclude group: 'com.android.support', module: 'support-compat'
        }
    }
}

// Proje genelinde kullanılacak ek ayarlar
ext {
    // React Native için önerilen sürümler
    reactNativeVersion = "0.73.0"
    // Diğer ortak bağımlılık sürümleri
    frescoVersion = "3.1.3"
    hermesVersion = "0.73.0"
}