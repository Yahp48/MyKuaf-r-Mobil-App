# Yerel geliştirme veritabanı: `docker compose up -d`
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mykuafor
      POSTGRES_PASSWORD: mykuafor_dev
      POSTGRES_DB: mykuafor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mykuafor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
